name: bugtracker

services:
  backend:
    build: ./BACKEND
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/bugtracker
    depends_on:
      - mongo

  frontend:
    build: ./FRONTEND
    ports:
      - "3000:80"
    depends_on:
      - backend

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
